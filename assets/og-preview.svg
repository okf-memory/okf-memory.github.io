<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#0f121d"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow orbs -->
  <circle cx="200" cy="150" r="180" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="220" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Card Container -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="#121624" fill-opacity="0.8" stroke="rgba(124, 58, 237, 0.3)" stroke-width="2"/>

  <!-- Header Badge -->
  <rect x="130" y="115" width="460" height="38" rx="19" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.4)"/>
  <circle cx="150" cy="134" r="5" fill="#10b981"/>
  <text x="168" y="139" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
    Release v0.1.0 • Google OKF v0.2 Compliant • Sub-300µs Search
  </text>

  <!-- Main Headline -->
  <text x="130" y="210" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    The Git-Native Memory for
  </text>
  <text x="130" y="265" fill="url(#brand)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    Autonomous AI Coding Agents
  </text>

  <!-- Subtitle -->
  <text x="130" y="325" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Sub-300µs BM25 search, embedded stdio MCP server &amp; progressive disclosure.
  </text>
  <text x="130" y="355" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Transparent, auditable Markdown memory for Claude Code, Cursor &amp; Local LLMs.
  </text>

  <!-- Quick Command Pill -->
  <rect x="130" y="420" width="440" height="56" rx="12" fill="#090a0f" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="160" y="455" fill="#38bdf8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="20" font-weight="700">
    $ brew install okf-memory/tap/okf
  </text>

  <!-- Stats Pills on Right -->
  <g transform="translate(680, 400)">
    <rect x="0" y="0" width="180" height="76" rx="12" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="20" y="32" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800">&lt; 300 µs</text>
    <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">BM25 Search</text>

    <rect x="200" y="0" width="180" height="76" rx="12" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(6, 182, 212, 0.3)"/>
    <text x="220" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800">0.00 €</text>
    <text x="220" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">100% Offline</text>
  </g>
</svg>
